[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mosquito-detection"
version = "0.1.0"
description = "Low-light mosquito detection and classification (Faster R-CNN, 6 species)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
