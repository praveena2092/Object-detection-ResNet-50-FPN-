data_root: data
sample_submission: data/sample_submission.csv
out_dir: outputs

val_fraction: 0.15
batch_size: 4
epochs: 10
lr: 0.005
weight_decay: 0.0005
num_workers: 2
seed: 42

enhance_low_light: true   # CLAHE + gamma on dark images (train and inference)
hflip: true               # horizontal-flip augmentation (train only)
score_sweep: [0.3, 0.4, 0.5, 0.6, 0.7]
score_thresh: 0.5         # used by predict.py if no tuned threshold is found
